<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkGuardian AI — Scan Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0d0f; --bg-2: #161618; --bg-3: #1e1e21;
      --border: rgba(255,255,255,0.08);
      --text: #f5f5f7; --text-2: #8e8e93;
      --red: #ff3b30; --orange: #ff9500; --green: #30d158; --blue: #0a84ff; --accent: #bf5af2;
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; height: 100%; overflow-x: hidden; }
    .header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--bg-2); }
    .logo-icon { width: 24px; height: 24px; background: linear-gradient(135deg, #bf5af2, #0a84ff); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .logo-text { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800; }
    .content { padding: 16px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
    .stat-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
    .stat-num { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; }
    .stat-label { font-size: 9px; color: var(--text-2); }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-2); margin-bottom: 8px; }
    .result-item { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 6px; }
    .result-item.broken { border-left: 3px solid var(--red); }
    .result-item.out_of_stock { border-left: 3px solid var(--orange); }
    .result-url { font-size: 11px; color: var(--text-2); word-break: break-all; }
    .result-suggestion { font-size: 10px; color: var(--green); margin-top: 4px; }
    .empty-state { text-align: center; padding: 40px 16px; }
    .empty-icon { font-size: 32px; margin-bottom: 8px; }
    .empty-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .empty-desc { font-size: 11px; color: var(--text-2); line-height: 1.5; }
    .scan-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #bf5af2, #0a84ff); border: none; border-radius: 10px; color: #fff; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 16px; transition: opacity 0.15s; }
    .scan-btn:hover { opacity: 0.85; }
    .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #results { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">🛡️</div>
    <div class="logo-text">LinkGuardian</div>
  </div>
  <div class="content">
    <button class="scan-btn" id="scan-btn">🔍 Scan This Page</button>
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">🔗</div>
      <div class="empty-title">No Scan Yet</div>
      <div class="empty-desc">Click "Scan This Page" to check all affiliate links on this page.</div>
    </div>
    <div id="results">
      <div class="stats">
        <div class="stat-card"><div class="stat-num" id="broken-count" style="color:var(--red)">0</div><div class="stat-label">BROKEN</div></div>
        <div class="stat-card"><div class="stat-num" id="ok-count" style="color:var(--green)">0</div><div class="stat-label">HEALTHY</div></div>
        <div class="stat-card"><div class="stat-num" id="total-count">0</div><div class="stat-label">TOTAL</div></div>
      </div>
      <div class="section-title">Issues Found</div>
      <div id="results-list"></div>
    </div>
  </div>
  <script>
    document.getElementById("scan-btn").addEventListener("click", async () => {
      const btn = document.getElementById("scan-btn");
      btn.disabled = true; btn.textContent = "⏳ Scanning…";
      try {
        const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
        const extracted = await chrome.tabs.sendMessage(tab.id, { action: "EXTRACT_LINKS" });
        if (!extracted?.links?.length) { alert("No external links found."); return; }
        const result = await chrome.runtime.sendMessage({ action: "CHECK_LINKS", links: extracted.links, pageUrl: extracted.page_url });
        if (!result.success) { alert(result.message || "API error"); return; }
        renderResults(result.results);
      } catch (err) { alert("Error: " + err.message); }
      finally { btn.disabled = false; btn.textContent = "🔍 Scan This Page"; }
    });
    function renderResults(data) {
      document.getElementById("empty-state").style.display = "none";
      document.getElementById("results").style.display = "block";
      document.getElementById("broken-count").textContent = data.summary.broken;
      document.getElementById("ok-count").textContent = data.summary.ok;
      document.getElementById("total-count").textContent = data.summary.total;
      const list = document.getElementById("results-list");
      list.innerHTML = "";
      const issues = [...data.broken_links, ...data.redirect_links];
      if (!issues.length) {
        list.innerHTML = '<div style="text-align:center;padding:16px;color:var(--green);font-size:12px;">✅ All links are healthy!</div>';
        return;
      }
      issues.forEach(link => {
        const el = document.createElement("div");
        el.className = "result-item " + link.status;
        el.innerHTML = `
          <div class="result-url">${link.url.slice(0,80)}${link.url.length>80?"…":""}</div>
          ${link.estimated_loss ? `<div style="font-size:10px;color:var(--orange);margin-top:2px;">📉 ${link.estimated_loss}</div>` : ""}
          ${link.ai_suggestion ? `<div class="result-suggestion">💡 ${link.ai_suggestion}</div>` : ""}
        `;
        list.appendChild(el);
      });
    }
  </script>
</body>
</html>
